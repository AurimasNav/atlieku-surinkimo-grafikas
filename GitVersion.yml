# Calculates the app version (expo.version: Android versionName, iOS CFBundleShortVersionString)
# for each release. See docs/releasing.md, "Versions".
#
# Trunk-based: every commit on main gets the next version by itself, so each release has its
# own version without tagging anything. The tags v0.0.1 to v0.0.7 (made when releases were
# tagged) are where the counting starts; keep them. For a bigger step, put "+semver: minor" (or
# "+semver: major") in a commit message, e.g. in the PR's merge commit description.
workflow: TrunkBased/preview1
next-version: 0.0.1

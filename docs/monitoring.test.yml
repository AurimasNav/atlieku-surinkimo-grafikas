      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="alytus",kind="food"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="alytus",kind="packaging"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="alytus",kind="glass"}'
        values: "86400x20"
      # Radviliškio r.: its files are posted in the last days before their periods, so its
      # packaging 3 days before its end raises nothing, nor do its glass and green waste.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="radviliskis",kind="packaging"}'
        values: "259200x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="radviliskis",kind="glass"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="radviliskis",kind="green"}'
        values: "86400x20"
      # Tauragės r. glass (quarterly) and Pagėgių sav. green waste: not watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="taurage",kind="glass"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="pagegiai",kind="green"}'
        values: "172800x20"
      # Panevėžio RATC's food waste, last collected on 10-23 December: not watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="pasvalys",kind="food"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="birzai",kind="food"}'

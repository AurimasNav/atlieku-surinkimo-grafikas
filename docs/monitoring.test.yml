  - name: Zarasų r. with a changed scan keeps yesterday's data
    interval: 15m
    input_series:
      # The build fails from the start, so its data stays as built then, with the mixed waste
      # dates of its rules 13 months ahead.
      - series: 'siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data",source="zarasai"}'
        values: "0x140"
      # The job publishes at 0h00 and 24h00.
      - series: 'siuksliaveze_status_checked_timestamp_seconds{job="siuksliaveze-data"}'
        values: "0x95 86400x44"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="zarasai",kind="household"}'
        values: "34000000x140"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="zarasai",kind="packaging"}'
        values: "2592000x140"
    alert_rule_test:
      - eval_time: 30h10m
        alertname: ScheduleDataStale
      - eval_time: 31h10m
        alertname: ScheduleDataRunsOut
      - eval_time: 31h10m
        alertname: ScheduleDataStale
        exp_alerts:
          - exp_labels:
              job: siuksliaveze-data
              source: zarasai
              severity: warning
            exp_annotations:
              summary: "Schedule data of zarasai is 1d 7h 10m 0s old"
              description: *stale

  - name: Kupiškio r. packaging 3 days before its end
    interval: 15m
    input_series:
      # A file a half year, posted around its start: 2 days' notice, so 3 days before the end
      # raises nothing.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kupiskis",kind="packaging"}'
        values: "259200x20"
    alert_rule_test:
      - eval_time: 2h10m
        alertname: ScheduleDataRunsOut

  - name: Širvintų r. mixed waste 3 days before its end
    interval: 15m
    input_series:
      # Its files come for periods of their own, posted around their starts: 2 days' notice,
      # so 3 days before the end raises nothing.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind="household"}'
        values: "259200x20"
      # Its packaging 30 days before its end neither.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="sirvintos",kind="packaging"}'
        values: "2592000x20"
    alert_rule_test:
      - eval_time: 2h10m
        alertname: ScheduleDataRunsOut

  - name: fewer places than a day before
    interval: 15m
    input_series:
      # 100 places until 24h00, then 80.
      - series: 'siuksliaveze_data_places{job="siuksliaveze-data",source="nemencine"}'
        values: "100x96 80x10"
    alert_rule_test:
      - eval_time: 23h10m
        alertname: ScheduleDataShrank
      # At the scrape that brings the change, and 7 and 14 minutes later.
      - eval_time: 24h15m
        alertname: ScheduleDataShrank
        exp_alerts: &shrank
          - exp_labels:
              job: siuksliaveze-data
              source: nemencine
              severity: warning
            exp_annotations:
              summary: "nemencine covers 10% fewer places than yesterday"
      - eval_time: 24h22m
        alertname: ScheduleDataShrank
        exp_alerts: *shrank
      - eval_time: 24h29m
        alertname: ScheduleDataShrank
        exp_alerts: *shrank

  - name: a warning pipeline/known-warnings.json doesn't list
    interval: 15m
    input_series:
      # nemezio: 2 new warnings from 2h00 (8 scrapes of 0, then 2) for two days, until
      # acknowledged at 50h00.
      - series: 'siuksliaveze_data_new_warnings{job="siuksliaveze-data",source="nemezio"}'
        values: "0x7 2x191 0x20"
      # Known warnings only: 6 of them, none new.
      - series: 'siuksliaveze_data_warnings{job="siuksliaveze-data",source="panevezio-r"}'
        values: "6x220"
      - series: 'siuksliaveze_data_new_warnings{job="siuksliaveze-data",source="panevezio-r"}'
        values: "0x220"
      # A source with warnings but no new_warnings series at all: nothing to compare.
      - series: 'siuksliaveze_data_warnings{job="siuksliaveze-data",source="kalvarija"}'
        values: "6x220"
    alert_rule_test:
      - eval_time: 1h50m
        alertname: ScheduleDataNewWarnings
      # Pending for 30 minutes after the scrape at 2h00.
      - eval_time: 2h20m
        alertname: ScheduleDataNewWarnings
      - eval_time: 2h40m
        alertname: ScheduleDataNewWarnings
        exp_alerts: &new
          - exp_labels:
              job: siuksliaveze-data
              source: nemezio
              severity: warning
            exp_annotations:
              summary: "nemezio: 2 new build warnings (not in pipeline/known-warnings.json)"
              dashboard: "https://aurimasnav.github.io/atlieku-surinkimo-grafikas/warnings.html#nemezio"
      # Between two scrapes, and a day later: it doesn't clear by itself.
      - eval_time: 12h07m
        alertname: ScheduleDataNewWarnings
        exp_alerts: *new
      - eval_time: 26h40m
        alertname: ScheduleDataNewWarnings
        exp_alerts: *new
      - eval_time: 49h50m
        alertname: ScheduleDataNewWarnings
        exp_alerts: *new
      # Acknowledged: back to 0 at 50h00.
      - eval_time: 50h10m
        alertname: ScheduleDataNewWarnings

  - name: a source disappears from metrics.txt
    interval: 15m
    input_series:
      # kauno is in the file until 10h00, then gone; the file itself is still fetched.
      - series: 'siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data",source="kauno"}'
        values: "0x40"
      - series: 'siuksliaveze_data_generated_timestamp_seconds{job="siuksliaveze-data",source="nemencine"}'
        values: "0x80"
      - series: 'up{job="siuksliaveze-data"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 10h10m
        alertname: ScheduleDataSourceMissing
      - eval_time: 12h10m
        alertname: ScheduleDataSourceMissing
        exp_alerts:
          - exp_labels:
              source: kauno
              severity: warning
            exp_annotations:
              summary: "kauno is missing from metrics.txt"


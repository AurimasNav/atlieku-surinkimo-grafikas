      # Kėdainių r. glass (four times a year, last in October): not watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kedainiai",kind="glass"}'
        values: "86400x20"
      # Molėtų r. glass (four times a year) and the town's green waste (last in mid-December):

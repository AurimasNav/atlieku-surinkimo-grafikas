        values: "86400x20"
      # Ukmergės r.: its mixed waste 10 days before its end raises nothing, nor does its glass
      # (once or twice a period, weeks before its end).
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ukmerge",kind="household"}'
        values: "864000x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="ukmerge",kind="glass"}'
        values: "86400x20"
      # Anykščiai's green waste, last collected on 21-22 December: not watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="anyksciai",kind="green"}'
        values: "86400x20"
      # Utenos r. glass (four times a year) and the town's green waste (last in mid-December):

        values: "86400x20"
      # Švenčionių r.: glass (four times a year, every other month in Pabradė) and mixed waste
      # (rules whose dates run ~13 months ahead, moved on by every build) are not watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="svencionys",kind="glass"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="svencionys",kind="household"}'
        values: "86400x20"
      # Zarasų r.'s mixed waste: rules, whose dates the build calculates ahead; a changed scan
      # shows as ScheduleDataStale instead. Not watched, even this close.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="zarasai",kind="household"}'
        values: "86400x20"
    alert_rule_test:

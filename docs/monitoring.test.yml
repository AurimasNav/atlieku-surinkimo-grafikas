      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="elektrenai",kind="glass"}'
        values: "86400x20"
      # Kupiškio r.: its mixed waste is calculated a year ahead from the page's rules (a page
      # that can't be read fails the build instead), its glass is collected twice a half year
      # and its food waste last on 22-23 December: none of them watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kupiskis",kind="household"}'
        values: "86400x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kupiskis",kind="glass"}'

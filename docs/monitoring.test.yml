        values: "2592000x20"
      # Raseinių r. green waste (to November) and Jonavos r. glass (four times a year): not
      # watched.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="raseiniai",kind="green"}'
        values: "172800x20"
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="jonava",kind="glass"}'
        values: "86400x20"
      # Kretingos r.: its files are posted a week or two before their periods, so its food waste
      # 3 days before its end raises nothing, nor do its glass and green waste.
      - series: 'siuksliaveze_data_last_date_timestamp_seconds{job="siuksliaveze-data",source="kretinga",kind="food"}'
        values: "259200x20"

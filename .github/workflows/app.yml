name: App

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  # No path filter on PRs: this is a required check, and a required check that never runs
  # would block the merge.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Native packages must match the installed Expo SDK; a lone react-native or reanimated
      # bump would build and then crash. Offline, so a new Expo patch release doesn't fail
      # unrelated pull requests.
      - name: Check native package versions against the Expo SDK
        run: npx expo install --check
        env:
          EXPO_OFFLINE: "1"
      - run: npm run i18n:check
      - run: npm run issue-forms:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

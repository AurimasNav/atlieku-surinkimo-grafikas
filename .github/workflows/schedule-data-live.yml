name: Schedule data live build

# Pull requests that change the pipeline (code or dependencies, e.g. a Renovate update of
# openpyxl or pdfplumber) build the data from today's files on nemenkom.lt, nkom.lt, tratc.lt,
# gargzdusvara.eu, uabtratc.lt, sratc.lt, aratc.lt, pratc.lt, maatc.lt, rkp.lt, jonavospaslaugos.lt, kretkom.lt, silute.lt, ecoservice.lt, kedainiai.lt, moletusvara.lt, skuodas.lt, ukmerge.lt, anykom.lt, utenoskom.lt, kompata.lt, eku.lt, sirvintos.lt, kupkom.lt, svencionys.lt and zarasai.lt and from Kauno švara's open data, the way the daily job does, and compare
# schedule.json with the published data. The unit tests in Schedule data / build only parse stored copies of the
# files. Nothing is deployed.
#
# The builds run in parallel, a job each ("live (Kupiškio r.)"), listed in
# pipeline/src/schedule_pipeline/live_builds.py: a new provider is an entry there, not a step
# here. Each job uploads its folder of the site; then the job "live" puts the folders together,
# compares schedule.json with the published data, indexes the regions, fails if a build
# failed, and fails if a build gave a warning pipeline/known-warnings.json doesn't list (unless
# the published data already has it as new: that one isn't the PR's).
on:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/schedule-data-live.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-data-live-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pipeline

jobs:
  # The matrix of the builds: python -m schedule_pipeline.live_builds --matrix.
  builds:
    name: live (list the builds)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Saves the uv cache when the dependencies change; the build jobs only restore it, so
      # they don't all try to save the same one.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: matrix
        run: echo "matrix=$(uv run python -m schedule_pipeline.live_builds --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: builds
    name: live (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A build that fails doesn't cancel the others: every source's result shows.
      fail-fast: false
      matrix: ${{ fromJSON(needs.builds.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked
      # --strict (in ARGS): a build that fails, or a part of it, fails the check, instead of
      # keeping its part of the published data as the daily job does.
      - name: ${{ matrix.title }}
        env:
          MODULE: ${{ matrix.module }}
          ARGS: ${{ matrix.args }}
          OUT: ${{ runner.temp }}/site/${{ matrix.out }}
        run: |
          # shellcheck disable=SC2086 # $ARGS: none, or several, e.g. --region silutes-r --strict
          uv run python -m "$MODULE" $ARGS --out "$OUT"
      # The site with only this build's folder (or, for Vilniaus r., schedule.json and
      # addresses.json), for the job "live".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 1

  # The name of the single job this workflow had, so the checks of a pull request still end with
  # "live". Runs after failed builds too: the comparison and the index of the others still show,
  # then the job fails.
  live:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          save-cache: false
      - run: uv sync --locked
      - name: Put the builds' folders together
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: live-*
          merge-multiple: true
          path: ${{ runner.temp }}/site
      - name: Compare with the published data
        run: |
          curl -fsSL https://aurimasnav.github.io/atlieku-surinkimo-grafikas/schedule.json -o "$RUNNER_TEMP/published.json"
          uv run python - "$RUNNER_TEMP/site/schedule.json" "$RUNNER_TEMP/published.json" <<'EOF'
          import json
          import os
          import sys

          new, old = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])


          def counts(data):
              # Per company: rows and places without `provider` are Nemenčinė's.
              result = {}

              def add(key):
                  result[key] = result.get(key, 0) + 1

              for place in data["locations"]:
                  add(f"{place.get('provider', 'nemencine')} places")
              for area in data["areas"]:
                  add(f"{area.get('provider', 'nemencine')} {area['kind']} rows")
              return result


          before, after = counts(old), counts(new)
          rows = "\n".join(
              f"| {key} | {before.get(key, 0)} | {after.get(key, 0)} |"
              for key in sorted(set(before) | set(after))
          )
          report = f"### Compared with the published data\n\n| | Published | This PR |\n|---|---|---|\n{rows}\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          # Same source files, so the counts should match. A drop of more than 10% means this
          # change parses less of them.
          dropped = [key for key, value in before.items() if after.get(key, 0) < 0.9 * value]
          if dropped:
              sys.exit(f"Much less data than published: {', '.join(dropped)}")
          EOF
      - name: Index the region folders (regions.json)
        run: uv run python -m schedule_pipeline.regions --site "$RUNNER_TEMP/site"
      # status.json, metrics.txt and warnings.html/.json, as the daily job publishes them: the
      # builds' warnings compared with this branch's pipeline/known-warnings.json.
      - name: Publish the state of the data (status.json, warnings.html)
        run: uv run python -m schedule_pipeline.status --site "$RUNNER_TEMP/site"
      # A new warning the published data already has (its warnings.json lists it as new, so the
      # alert is firing) isn't this PR's: it is listed apart and doesn't fail the check, or every
      # pipeline PR (Renovate's too) would fail until it is fixed or acknowledged. The rest are
      # this PR's: $RUNNER_TEMP/pr-new.json, for the last step. Before the daily job published
      # warnings.json (404), every new warning is this PR's.
      - name: Compare the warnings with the published data
        run: |
          curl -fsSL https://aurimasnav.github.io/atlieku-surinkimo-grafikas/status.json -o "$RUNNER_TEMP/published-status.json"
          code=$(curl -sSL https://aurimasnav.github.io/atlieku-surinkimo-grafikas/warnings.json -o "$RUNNER_TEMP/published-warnings.json" -w '%{http_code}')
          case "$code" in
            200) ;;
            404) rm -f "$RUNNER_TEMP/published-warnings.json" ;;
            *) echo "::error::warnings.json of the published data: HTTP $code"; exit 1 ;;
          esac
          uv run python - "$RUNNER_TEMP/site/warnings.json" "$RUNNER_TEMP/published-status.json" "$RUNNER_TEMP/published-warnings.json" "$RUNNER_TEMP/pr-new.json" <<'EOF'
          import html
          import json
          import os
          import sys

          from schedule_pipeline.status import split_new

          site, status_path, warnings_path, out = sys.argv[1:5]
          new, old = (json.load(open(path, encoding="utf-8")) for path in (site, status_path))
          published = {source: data["warnings"] for source, data in old["sources"].items()}
          if os.path.exists(warnings_path):
              mine, already = split_new(new, json.load(open(warnings_path, encoding="utf-8")))
              note = "Already live: the published data has them as new too (the alert is firing); they don't fail this check."
          else:
              mine, already = split_new(new, None)
              note = "The published data has no warnings.json yet: every new warning counts as this PR's."
          with open(out, "w", encoding="utf-8") as file:
              json.dump({"new": mine, "alreadyLive": already}, file, ensure_ascii=False)


          def details(source, texts, what):
              items = "\n".join(f"- {html.escape(text)}" for text in texts)
              return f"<details><summary>{source}: {len(texts)} {what}</summary>\n\n{items}\n\n</details>\n"


          rows, lists = [], []
          for source in sorted(set(published) | set(new["sources"])):
              data = new["sources"].get(source)
              cells = [published.get(source, "-")]
              if data:
                  cells += [data["warnings"], len(mine.get(source, [])), len(already.get(source, []))]
              else:
                  cells += ["-", "-", "-"]
              rows.append(f"| {source} | " + " | ".join(map(str, cells)) + " |")
              if source in mine:
                  lists.append(details(source, mine[source], "new"))
              if source in already:
                  lists.append(details(source, already[source], "already live"))
          total = sum(map(len, mine.values()))
          report = (
              "### Warnings compared with the published data\n\n"
              f"New: not in this branch's pipeline/known-warnings.json ({total} in all). {note}\n\n"
              "| Source | Published | This PR | New | Already live |\n|---|---|---|---|---|\n"
              + "\n".join(rows)
              + "\n\n"
              + "\n".join(lists)
          )
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          EOF
      - name: Fail if a build failed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Not every build passed: see the failed live (…) jobs."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: schedule-data-${{ github.event.pull_request.number || github.ref_name }}
          path: ${{ runner.temp }}/site
          retention-days: 14
      # After the upload, so the data with the new warnings can be downloaded and acknowledged.
      - name: Fail on warnings pipeline/known-warnings.json doesn't list
        run: |
          uv run python - "$RUNNER_TEMP/pr-new.json" <<'EOF'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))


          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          live = 0
          for source, texts in sorted(report["alreadyLive"].items()):
              for text in texts:
                  live += 1
                  print(f"::notice title=Already live ({source})::{escape(text)}")
          if live:
              print(
                  f"::notice::{live} new warnings the published data already has (the alert is firing):"
                  " not this PR's, so they don't fail it. Fix or acknowledge them in a PR of their own."
              )
          total = 0
          for source, texts in sorted(report["new"].items()):
              for text in texts:
                  total += 1
                  print(f"::error title=New warning ({source})::{escape(text)}")
          if total:
              print(
                  f"::error::{total} warnings that pipeline/known-warnings.json doesn't list (above, and"
                  " in the job summary). Fix the parser, or acknowledge them: download this run's"
                  " schedule-data artifact and run `uv run python -m schedule_pipeline.status --site"
                  " <site> --write-known` in pipeline/, then commit pipeline/known-warnings.json"
                  " (docs/monitoring.md, Build warnings)."
              )
              sys.exit(1)
          print("No new warnings")
          EOF

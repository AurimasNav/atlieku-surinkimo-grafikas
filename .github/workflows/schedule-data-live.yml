name: Schedule data live build

# Pull requests that change the pipeline (code or dependencies, e.g. a Renovate update of
# openpyxl or pdfplumber) build the data from today's files on nemenkom.lt, nkom.lt, tratc.lt,
# gargzdusvara.eu, uabtratc.lt, sratc.lt, aratc.lt, pratc.lt, maatc.lt, rkp.lt, jonavospaslaugos.lt, kretkom.lt, silute.lt, ecoservice.lt, kedainiai.lt and ukmerge.lt and from Kauno švara's open data, the way the daily job does, and compare
# schedule.json with the published data. The unit tests in Schedule data / build only parse stored copies of the
# files. Nothing is deployed.
on:
  pull_request:
    paths: ["pipeline/**", ".github/workflows/schedule-data-live.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-data-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Build schedule.json from the live websites
        # --strict: a company whose build fails fails the check, instead of keeping its part of
        # the published data as the daily job does.
        run: uv run python -m schedule_pipeline --strict --out "$RUNNER_TEMP/site/schedule.json"
      - name: Build the Kauno r. and Kaišiadorių r. schedules from Kauno švara's open-data file
        run: uv run python -m schedule_pipeline.svara --out "$RUNNER_TEMP/site/kauno-r"
      - name: Build the Mažeikių r., Telšių r., Plungės r. and Rietavo sav. schedules from the files on tratc.lt
        # --strict: a municipality whose build fails fails the check.
        run: uv run python -m schedule_pipeline.tratc --strict --out "$RUNNER_TEMP/site/mazeikiu-r"
      - name: Build the Klaipėdos r. schedule from the spreadsheet on gargzdusvara.eu
        run: uv run python -m schedule_pipeline.gargzdu --out "$RUNNER_TEMP/site/klaipedos-r"
      - name: Build the Jurbarko r., Tauragės r., Šilalės r. and Pagėgių sav. schedules from the PDFs on uabtratc.lt
        # --strict: a municipality whose build fails fails the check.
        run: uv run python -m schedule_pipeline.taurage --strict --out "$RUNNER_TEMP/site/jurbarko-r"
      - name: Build the Šiaulių RATC schedules (six municipalities) from the PDFs on sratc.lt
        # --strict: a part (the five, or Radviliškio r.) whose build fails fails the check.
        run: uv run python -m schedule_pipeline.sratc --strict --out "$RUNNER_TEMP/site/sratc"
      - name: Build the Alytaus RATC schedule from the PDFs on aratc.lt
        run: uv run python -m schedule_pipeline.aratc --out "$RUNNER_TEMP/site/alytaus-ratc"
      - name: Build the Pasvalio r., Rokiškio r., Biržų r. and Panevėžio r. schedules from the spreadsheets on pratc.lt
        # --strict: a municipality whose build fails fails the check.
        run: uv run python -m schedule_pipeline.pratc --strict --out "$RUNNER_TEMP/site/panevezio-ratc"
      - name: Build the Marijampolės AATC schedules (five municipalities) from the PDFs on maatc.lt
        # --strict: a municipality whose build fails fails the check.
        run: uv run python -m schedule_pipeline.maatc --strict --out "$RUNNER_TEMP/site/maatc"
      - name: Build the Raseinių r. schedule from the PDFs on rkp.lt
        # --strict: a file that can't be read fails the check, instead of keeping its rows of the
        # published data as the daily job does.
        run: uv run python -m schedule_pipeline.raseiniai --strict --out "$RUNNER_TEMP/site/raseiniu-r"
      - name: Build the Jonavos r. schedule from the PDFs on jonavospaslaugos.lt
        # --strict: a file that can't be read fails the check.
        run: uv run python -m schedule_pipeline.jonava --strict --out "$RUNNER_TEMP/site/jonavos-r"
      - name: Build the Kretingos r. schedule from the PDFs on kretkom.lt
        run: uv run python -m schedule_pipeline.kretinga --out "$RUNNER_TEMP/site/kretingos-r"
      - name: Build the Šilutės r. schedule from the PDF on silute.lt (or its copy)
        # --strict: a build that fails fails the check. silute.lt refuses the runners: the copy in
        # pipeline/data is read instead, with a warning.
        run: uv run python -m schedule_pipeline.ecoservice --region silutes-r --strict --out "$RUNNER_TEMP/site/silutes-r"
      - name: Build the Trakų r. and Šalčininkų r. schedules from the PDFs on ecoservice.lt
        # --strict: a municipality whose build fails fails the check.
        run: uv run python -m schedule_pipeline.ecoservice --region ecoservice --strict --out "$RUNNER_TEMP/site/ecoservice"
      - name: Build the Kėdainių r. schedule from the elderships' files on kedainiai.lt (or their copy)
        # kedainiai.lt refuses the runners: the copy in pipeline/data is read instead, with a
        # warning. --strict: a file that can't be read fails the check, instead of keeping its
        # rows of the published data as the daily job does.
        run: uv run python -m schedule_pipeline.kedainiai --strict --out "$RUNNER_TEMP/site/kedainiu-r"
      - name: Build the Ukmergės r. schedule from the PDFs on ukmerge.lt (or their copy)
        # ukmerge.lt refuses the runners: the copy in pipeline/data is read instead, with a
        # warning.
        run: uv run python -m schedule_pipeline.ukmerge --out "$RUNNER_TEMP/site/ukmerges-r"
      - name: Compare with the published data
        run: |
          curl -fsSL https://aurimasnav.github.io/atlieku-surinkimo-grafikas/schedule.json -o "$RUNNER_TEMP/published.json"
          uv run python - "$RUNNER_TEMP/site/schedule.json" "$RUNNER_TEMP/published.json" <<'EOF'
          import json
          import os
          import sys

          new, old = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])


          def counts(data):
              # Per company: rows and places without `provider` are Nemenčinė's.
              result = {}

              def add(key):
                  result[key] = result.get(key, 0) + 1

              for place in data["locations"]:
                  add(f"{place.get('provider', 'nemencine')} places")
              for area in data["areas"]:
                  add(f"{area.get('provider', 'nemencine')} {area['kind']} rows")
              return result


          before, after = counts(old), counts(new)
          rows = "\n".join(
              f"| {key} | {before.get(key, 0)} | {after.get(key, 0)} |"
              for key in sorted(set(before) | set(after))
          )
          report = f"### Compared with the published data\n\n| | Published | This PR |\n|---|---|---|\n{rows}\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          # Same source files, so the counts should match. A drop of more than 10% means this
          # change parses less of them.
          dropped = [key for key, value in before.items() if after.get(key, 0) < 0.9 * value]
          if dropped:
              sys.exit(f"Much less data than published: {', '.join(dropped)}")
          EOF
      - name: Index the region folders (regions.json)
        run: uv run python -m schedule_pipeline.regions --site "$RUNNER_TEMP/site"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: schedule-data-${{ github.event.pull_request.number || github.ref_name }}
          path: ${{ runner.temp }}/site
          retention-days: 14

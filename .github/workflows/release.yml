name: Release

# Every merge to main that touches the app builds a signed Android App Bundle here on GitHub
# Actions and uploads it to Google Play's internal testing track (testers only). Promoting a
# tested build to the public is a manual step in Play Console (docs/releasing.md).
#
# Run it by hand (Actions → Release → Run workflow) to test a build from any branch: with
# "dry run" ticked, it builds and signs but doesn't upload. Pull requests that change this
# workflow (e.g. Renovate updating its actions) get the same dry run.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/release.yml"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and sign only; don't upload to Google Play)
        type: boolean
        default: true

permissions:
  contents: read

# Never run two releases at once; a newer merge waits for the running one (and replaces an older
# waiting one: testers only need the newest build). Pull request dry runs get a queue per PR,
# and a newer push replaces an older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_NAME: io.github.aurimasnav.siuksliaveze
  # Only merges to main and runs by hand without "dry run" upload.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}

jobs:
  checks:
    # Merges release only once Google Play access is set up (docs/releasing.md, one-time setup).
    if: vars.RELEASE_ENABLED == 'true' || github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  # GitVersion counts the commits on main from the first one (GitVersion.yml): every commit gets
  # the next version by itself, so nothing is tagged. Tagging after the upload made a waiting
  # release's tag push fail once a later merge had changed a workflow file, and the next
  # release then reused 0.0.6.
  version:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # GitVersion needs the full history and tags
      - uses: gittools/actions/gitversion/setup@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
        with:
          # Exact: trunk-based is still a preview workflow in GitVersion 6, checked with 6.8.2.
          versionSpec: 6.8.2
      - id: gitversion
        uses: gittools/actions/gitversion/execute@389fe43e6b0189b98c40c43553070ac029304635 # v5.0.0
      # Google Play needs a higher version code for every upload. The number of commits on main
      # only grows, and a retried release of the same commit reuses its number.
      - id: code
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - run: |
          echo "Version ${{ steps.gitversion.outputs.majorMinorPatch }}, version code ${{ steps.code.outputs.code }}" >> "$GITHUB_STEP_SUMMARY"
          [ "$PUBLISH" = true ] || echo "Dry run: nothing is uploaded." >> "$GITHUB_STEP_SUMMARY"

  # iOS isn't released yet (docs/releasing.md, "Adding iOS later"); it would be a second job
  # on a macOS runner.
  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - name: Check that the release secrets exist
        if: env.PUBLISH == 'true'
        working-directory: .
        env:
          HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          [ "$HAS_PLAY" = true ] || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Compiled C++ of the native libraries, shared with the App Android build's PR builds
      # (same key); pinned to a commit like every action here, since this job signs the app.
      - uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: android
          max-size: 2G
      - run: npm ci
      # Not committed: the generated Android project picks these up from app.json.
      - name: Set the version to ${{ env.VERSION }} (${{ env.VERSION_CODE }})
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = process.env.VERSION;
            config.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key: the bundle is signed with the debug key and can't be uploaded"
          fi
      - name: Build the app bundle
        working-directory: app/android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: upload
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # All four architectures (Google Play serves each phone its own). --build-cache reuses
        # compiled Java and Kotlin from earlier builds; Gradle gets 4 of the runner's 16 GB.
        run: ./gradlew bundleRelease --build-cache "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Check the bundle is signed with the upload key
        if: env.ANDROID_UPLOAD_STORE_FILE != ''
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/cert.txt"
          grep -q "CN=Level 9" "$RUNNER_TEMP/cert.txt" || { echo "::error::Not signed with the upload key"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: siuksliaveze-${{ env.VERSION }}-${{ env.VERSION_CODE }}
          # The mapping file turns R8's shortened names in stack traces back into readable ones.
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Upload to Google Play (internal testing)
        if: env.PUBLISH == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          # So crash reports in Play Console show readable stack traces despite R8.
          mappingFile: app/android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.VERSION }} (${{ env.VERSION_CODE }})
          track: internal
          # "draft" while Google Play refuses completed releases for an app that was never
          # published (docs/releasing.md, troubleshooting); otherwise testers get it right away.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

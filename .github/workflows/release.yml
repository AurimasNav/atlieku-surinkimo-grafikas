name: Release

# Every merge to main that touches the app builds it on EAS and submits it to the TEST
# channel only (Google Play internal testing). Promoting a tested build to the public is a
# manual step in Play Console (docs/releasing.md).
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once; a newer merge waits for the running one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    # Off until the store accounts and EAS credentials exist (docs/releasing.md, step 6).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  version:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion needs the full history and tags
      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
      - run: echo "Releasing version ${{ steps.gitversion.outputs.majorMinorPatch }}" >> "$GITHUB_STEP_SUMMARY"

  build-and-submit:
    needs: version
    runs-on: ubuntu-latest
    environment: testers
    strategy:
      fail-fast: false # one platform failing shouldn't stop the others
      matrix:
        # Android only for now. Add `ios` once there is an Apple Developer account
        # (docs/releasing.md, "Adding iOS later"); both then build in parallel.
        platform: [android]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Not committed: EAS uploads the working tree, so the build picks up the calculated version.
      - name: Set the app version to ${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = process.env.VERSION;
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '
      # Waits for the build so failures show up here. Public repos don't pay for Actions minutes.
      - name: Build on EAS and submit to testers
        run: >
          eas build
          --platform ${{ matrix.platform }}
          --profile production
          --auto-submit
          --non-interactive

  # Marks the released commit, so the next release gets the next version. Only after every
  # platform succeeded: a failed release is retried with the same version.
  tag:
    needs: [version, build-and-submit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag v${{ needs.version.outputs.version }}
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

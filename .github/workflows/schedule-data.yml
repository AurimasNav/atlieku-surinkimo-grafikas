name: Schedule data

# Scrapes nemenkom.lt daily and publishes schedule.json + the privacy policy to GitHub Pages.
# If parsing or validation fails, nothing is deployed and the last good data stays live.
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "PRIVACY.md"
      - ".github/workflows/schedule-data.yml"
  # No path filter on PRs: this is a required check (it only runs tests on PRs).
  pull_request:

permissions:
  contents: read

# Deploys queue one at a time. PR checks get a queue per PR (a newer push replaces an older
# check), so they can't cancel each other or wait for a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 # publishes exact version tags only
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Build schedule.json from the live website
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline --out ../site/schedule.json
      - name: Render privacy policy
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.site ../PRIVACY.md --out ../site/privacy/index.html --title "Privacy Policy / Privatumo politika"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

name: Schedule data

# Scrapes nemenkom.lt, nkom.lt, Kauno švara and tratc.lt daily and publishes the data + the privacy
# policy to GitHub Pages. If parsing or validation fails, nothing is deployed and the last good
# data stays live; a provider whose build fails keeps its part of yesterday's data instead.
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "PRIVACY.md"
      - ".github/workflows/schedule-data.yml"
  # No path filter on PRs: this is a required check (it only runs tests on PRs).
  pull_request:

permissions:
  contents: read

# Deploys queue one at a time. PR checks get a queue per PR (a newer push replaces an older
# check), so they can't cancel each other or wait for a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 # publishes exact version tags only
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Build schedule.json from the live websites
        if: github.event_name != 'pull_request'
        # Vilniaus r.: Nemenčinės and Nemėžio komunalininkas. If one company's build fails, its
        # part of yesterday's schedule.json is kept and the step logs a warning annotation.
        run: uv run python -m schedule_pipeline --out ../site/schedule.json
      # Its own file and app download (site/kauno-r): its failure must not hold back the
      # Vilniaus r. data, so on failure the files published yesterday are kept instead.
      - name: Build the Kauno r. schedule (Kauno švara)
        id: kauno
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.svara --out ../site/kauno-r
      - name: Keep the published Kauno r. data if today's build failed
        if: steps.kauno.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/kauno-r
          out=../site/kauno-r
          rm -rf "$out" && mkdir -p "$out/addresses"
          if curl -fsS "$base/schedule.json" -o "$out/schedule.json"; then
            for id in $(python3 -c "import json, sys; print(' '.join(e['id'] for e in json.load(open(sys.argv[1], encoding='utf-8'))['elderships']))" "$out/schedule.json"); do
              curl -fsS "$base/addresses/$id.json" -o "$out/addresses/$id.json"
            done
            curl -fsS "$base/points.json" -o "$out/points.json" || true
            echo "::warning::The Kauno r. build failed; yesterday's published data is kept."
          else
            rm -rf "$out"
            echo "::warning::The Kauno r. build failed and there is no published data to keep."
          fi
      # Mažeikių r., from the files of the regional waste centre (site/mazeikiu-r): the same
      # rule, yesterday's files are kept if today's build fails.
      - name: Build the Mažeikių r. schedule (TRATC)
        id: mazeikiai
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.tratc --out ../site/mazeikiu-r
      - name: Keep the published Mažeikių r. data if today's build failed
        if: steps.mazeikiai.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/mazeikiu-r
          out=../site/mazeikiu-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Mažeikių r. build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Mažeikių r. build failed and there is no published data to keep."
          else
            # Publishing now would take the Mažeikių r. files off the site: fail, and the site
            # keeps everything it has.
            echo "::error::The Mažeikių r. build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # status.json and metrics.txt for monitoring (docs/monitoring.md).
      - name: Publish the state of the data
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.status --site ../site
      - name: Render privacy policy
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.site ../PRIVACY.md --out ../site/privacy/index.html --title "Privacy Policy / Privatumo politika"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

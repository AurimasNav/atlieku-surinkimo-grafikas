name: Schedule data

# Scrapes nemenkom.lt, nkom.lt, Kauno švara, tratc.lt, gargzdusvara.eu, uabtratc.lt, sratc.lt, aratc.lt, pratc.lt, maatc.lt, rkp.lt and jonavospaslaugos.lt daily and
# publishes the data + the privacy policy to GitHub Pages. If parsing or validation fails, nothing is deployed and the last good
# data stays live; a provider whose build fails keeps its part of yesterday's data instead.
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "PRIVACY.md"
      - ".github/workflows/schedule-data.yml"
  # No path filter on PRs: this is a required check (it only runs tests on PRs).
  pull_request:

permissions:
  contents: read

# Deploys queue one at a time. PR checks get a queue per PR (a newer push replaces an older
# check), so they can't cancel each other or wait for a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 # publishes exact version tags only
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Build schedule.json from the live websites
        if: github.event_name != 'pull_request'
        # Vilniaus r.: Nemenčinės and Nemėžio komunalininkas. If one company's build fails, its
        # part of yesterday's schedule.json is kept and the step logs a warning annotation.
        run: uv run python -m schedule_pipeline --out ../site/schedule.json
      # Its own file and app download (site/kauno-r, with Kaišiadorių r. from the same file of
      # Kauno švara): its failure must not hold back the Vilniaus r. data, so on failure the
      # files published yesterday are kept instead.
      - name: Build the Kauno r. and Kaišiadorių r. schedules (Kauno švara)
        id: kauno
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.svara --out ../site/kauno-r
      - name: Keep the published Kauno r. data if today's build failed
        if: steps.kauno.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/kauno-r
          out=../site/kauno-r
          rm -rf "$out" && mkdir -p "$out/addresses"
          if curl -fsS "$base/schedule.json" -o "$out/schedule.json"; then
            for id in $(python3 -c "import json, sys; print(' '.join(e['id'] for e in json.load(open(sys.argv[1], encoding='utf-8'))['elderships']))" "$out/schedule.json"); do
              curl -fsS "$base/addresses/$id.json" -o "$out/addresses/$id.json"
            done
            curl -fsS "$base/points.json" -o "$out/points.json" || true
            echo "::warning::The Kauno r. build failed; yesterday's published data is kept."
          else
            rm -rf "$out"
            echo "::warning::The Kauno r. build failed and there is no published data to keep."
          fi
      # Mažeikių r., Telšių r., Plungės r. and Rietavo sav., from the files of the regional
      # waste centre (site/mazeikiu-r, a part each): a municipality whose build fails keeps its
      # part of yesterday's file; if none can be built, yesterday's files are kept.
      - name: Build the Mažeikių r., Telšių r., Plungės r. and Rietavo sav. schedules (TRATC)
        id: mazeikiai
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.tratc --out ../site/mazeikiu-r
      - name: Keep the published TRATC data if today's build failed
        if: steps.mazeikiai.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/mazeikiu-r
          out=../site/mazeikiu-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The TRATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The TRATC build failed and there is no published data to keep."
          else
            # Publishing now would take the TRATC files off the site: fail, and the site
            # keeps everything it has.
            echo "::error::The TRATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Klaipėdos r., from the spreadsheet of Gargždų švara (site/klaipedos-r): the same rule.
      - name: Build the Klaipėdos r. schedule (Gargždų švara)
        id: klaipedos
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.gargzdu --out ../site/klaipedos-r
      - name: Keep the published Klaipėdos r. data if today's build failed
        if: steps.klaipedos.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/klaipedos-r
          out=../site/klaipedos-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Klaipėdos r. build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Klaipėdos r. build failed and there is no published data to keep."
          else
            echo "::error::The Klaipėdos r. build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Jurbarko r., Tauragės r., Šilalės r. and Pagėgių sav., from the PDFs of Tauragės RATC
      # (site/jurbarko-r, a part each): a municipality whose build fails keeps its part of
      # yesterday's file; if none can be built, yesterday's files are kept.
      - name: Build the Jurbarko r., Tauragės r., Šilalės r. and Pagėgių sav. schedules (Tauragės RATC)
        id: jurbarkas
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.taurage --out ../site/jurbarko-r
      - name: Keep the published Tauragės RATC data if today's build failed
        if: steps.jurbarkas.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/jurbarko-r
          out=../site/jurbarko-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Tauragės RATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Tauragės RATC build failed and there is no published data to keep."
          else
            echo "::error::The Tauragės RATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Šiaulių r., Akmenės r., Joniškio r., Kelmės r. and Pakruojo r., and Radviliškio r., from
      # the PDFs of Šiaulių RATC (site/sratc, a part for the five and one for Radviliškio r.): a
      # part whose build fails keeps its part of yesterday's file; if neither can be built,
      # yesterday's files are kept.
      - name: Build the Šiaulių RATC schedules (six municipalities)
        id: siauliai
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.sratc --out ../site/sratc
      - name: Keep the published Šiaulių RATC data if today's build failed
        if: steps.siauliai.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/sratc
          out=../site/sratc
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Šiaulių RATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Šiaulių RATC build failed and there is no published data to keep."
          else
            echo "::error::The Šiaulių RATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Alytaus r., Prienų r., Lazdijų r., Varėnos r., Druskininkai and Birštonas, from the PDFs
      # of Alytaus RATC (site/alytaus-ratc): the same rule.
      - name: Build the Alytaus RATC schedule (six municipalities)
        id: alytus
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.aratc --out ../site/alytaus-ratc
      - name: Keep the published Alytaus RATC data if today's build failed
        if: steps.alytus.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/alytaus-ratc
          out=../site/alytaus-ratc
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Alytaus RATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Alytaus RATC build failed and there is no published data to keep."
          else
            echo "::error::The Alytaus RATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Pasvalio r., Rokiškio r., Biržų r. and Panevėžio r., from the spreadsheets of Panevėžio
      # RATC (site/panevezio-ratc, a part each): a municipality whose build fails keeps its part
      # of yesterday's file; if none can be built, yesterday's files are kept.
      - name: Build the Pasvalio r., Rokiškio r., Biržų r. and Panevėžio r. schedules (Panevėžio RATC)
        id: panevezys
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.pratc --out ../site/panevezio-ratc
      - name: Keep the published Panevėžio RATC data if today's build failed
        if: steps.panevezys.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/panevezio-ratc
          out=../site/panevezio-ratc
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Panevėžio RATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Panevėžio RATC build failed and there is no published data to keep."
          else
            echo "::error::The Panevėžio RATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Marijampolės sav., Vilkaviškio r., Kalvarijos sav., Kazlų Rūdos sav. and Šakių r., from the
      # PDFs on the pages of the regional waste centre (site/maatc, a part each): a municipality
      # whose build fails keeps its part of yesterday's file; if none can be built, yesterday's
      # files are kept.
      - name: Build the Marijampolės AATC schedules (five municipalities)
        id: marijampole
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.maatc --out ../site/maatc
      - name: Keep the published Marijampolės AATC data if today's build failed
        if: steps.marijampole.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/maatc
          out=../site/maatc
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Marijampolės AATC build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Marijampolės AATC build failed and there is no published data to keep."
          else
            echo "::error::The Marijampolės AATC build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Raseinių r., from the PDFs of UAB „Raseinių komunalinės paslaugos“ (site/raseiniu-r): a
      # file that can't be read keeps its rows of yesterday's data; if the build fails,
      # yesterday's files are kept.
      - name: Build the Raseinių r. schedule (Raseinių komunalinės paslaugos)
        id: raseiniai
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.raseiniai --out ../site/raseiniu-r
      - name: Keep the published Raseinių r. data if today's build failed
        if: steps.raseiniai.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/raseiniu-r
          out=../site/raseiniu-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Raseinių r. build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Raseinių r. build failed and there is no published data to keep."
          else
            echo "::error::The Raseinių r. build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # Jonavos r., from the PDFs of UAB „Jonavos paslaugos“ (site/jonavos-r): the same rules.
      - name: Build the Jonavos r. schedule (Jonavos paslaugos)
        id: jonava
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: uv run python -m schedule_pipeline.jonava --out ../site/jonavos-r
      - name: Keep the published Jonavos r. data if today's build failed
        if: steps.jonava.outcome == 'failure'
        run: |
          base=https://aurimasnav.github.io/atlieku-surinkimo-grafikas/jonavos-r
          out=../site/jonavos-r
          rm -rf "$out" && mkdir -p "$out"
          get() { curl -sS --retry 3 --max-time 120 -o "$out/$1" -w '%{http_code}' "$base/$1" || true; }
          code=$(get schedule.json)
          if [ "$code" = 200 ] && [ "$(get addresses.json)" = 200 ]; then
            echo "::warning::The Jonavos r. build failed; yesterday's published data is kept."
          elif [ "$code" = 404 ]; then
            rm -rf "$out"
            echo "::warning::The Jonavos r. build failed and there is no published data to keep."
          else
            echo "::error::The Jonavos r. build failed and the published data couldn't be downloaded (HTTP $code)."
            exit 1
          fi
      # status.json and metrics.txt for monitoring (docs/monitoring.md).
      - name: Publish the state of the data
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.status --site ../site
      - name: Render privacy policy
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.site ../PRIVACY.md --out ../site/privacy/index.html --title "Privacy Policy / Privatumo politika"
      # regions.json: every region folder in site/ as it is deployed, so installed apps download
      # a new one without an update (schedule_pipeline.regions). Last, after the builds and the
      # steps that keep yesterday's data.
      - name: Publish the index of regions
        if: github.event_name != 'pull_request'
        run: uv run python -m schedule_pipeline.regions --site ../site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

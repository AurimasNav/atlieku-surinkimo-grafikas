# Generated by app/scripts/issue-forms.mjs. Edit that file, then run `npm run issue-forms` in app/.
name: "EN · Report a problem"
description: "Something in the app doesn't work as expected."
title: "[Bug]: "
labels: ["bug", "lang:en"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! For wrong pickup dates, please use the **Wrong dates or address** form instead."
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "What did you do, and what went wrong?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Open Settings
        2. Tap …
  - type: input
    id: app-version
    attributes:
      label: "App version"
      description: "Filled in automatically when you report from the app."
  - type: input
    id: device
    attributes:
      label: "Phone and system version"
      placeholder: "e.g. Samsung Galaxy A54, Android 15"
  - type: input
    id: language
    attributes:
      label: "App language"

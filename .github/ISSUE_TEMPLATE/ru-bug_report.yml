# Generated by app/scripts/issue-forms.mjs. Edit that file, then run `npm run issue-forms` in app/.
name: "RU · Сообщить о проблеме"
description: "Что-то в приложении работает не так, как должно."
title: "[Bug]: "
labels: ["bug", "lang:ru"]
body:
  - type: markdown
    attributes:
      value: "Спасибо за сообщение! Если неверны даты вывоза, воспользуйтесь формой **Неверные даты или адрес**."
  - type: textarea
    id: what-happened
    attributes:
      label: "Что произошло?"
      description: "Что вы делали и что пошло не так?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Чего вы ожидали?"
  - type: textarea
    id: steps
    attributes:
      label: "Как воспроизвести"
      placeholder: |
        1. Откройте настройки
        2. Нажмите …
  - type: input
    id: app-version
    attributes:
      label: "Версия приложения"
      description: "Заполняется автоматически, если сообщить из приложения."
  - type: input
    id: device
    attributes:
      label: "Телефон и версия системы"
      placeholder: "например, Samsung Galaxy A54, Android 15"
  - type: input
    id: language
    attributes:
      label: "Язык приложения"

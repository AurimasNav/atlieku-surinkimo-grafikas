# Generated by app/scripts/issue-forms.mjs. Edit that file, then run `npm run issue-forms` in app/.
name: "RU · Неверные даты или адрес"
description: "Неверные даты вывоза, или адрес не находится либо привязан не к тому графику."
title: "[Schedule]: "
labels: ["schedule-data", "lang:ru"]
body:
  - type: markdown
    attributes:
      value: |
        Приложение автоматически обрабатывает официальные графики компаний по вывозу отходов, поэтому возможны ошибки. Сравните с официальным графиком:
        - UAB „Nemenčinės komunalininkas“: https://www.nemenkom.lt/buitiniu-ir-pakuociu-atlieku-surinkimo-grafikas/
        - UAB „Nemėžio komunalininkas“: https://www.nkom.lt/kita.html
        - UAB „Kauno švara“: https://grafikai.svara.lt/
        - UAB „Telšių regiono atliekų tvarkymo centras“: https://tratc.lt/atlieku-surinkimo-grafikai/
        - VšĮ „Gargždų švara“: https://www.gargzdusvara.eu/komunaliniu-atlieku-tvarkymo-grafikai/
        - UAB „Tauragės regiono atliekų tvarkymo centras“: https://www.uabtratc.lt/atlieku-surinkimo-grafikai/
        - UAB „Šiaulių regiono atliekų tvarkymo centras“: https://www.sratc.lt/kalendoriaus-grafikai/
        - UAB „Alytaus regiono atliekų tvarkymo centras“: https://www.aratc.lt/atlieku-surinkimo-grafikai/
        - UAB „Panevėžio regiono atliekų tvarkymo centras“: https://www.pratc.lt/atlieku-isvezimas-atlieku-isvezimas/
        - UAB „Marijampolės apskrities atliekų tvarkymo centras“: https://maatc.lt/atlieku-isvezimo-grafikai/
        - UAB „Raseinių komunalinės paslaugos“: https://www.rkp.lt/atlieku-tvarkymas/
        - UAB „Jonavos paslaugos“: https://www.jonavospaslaugos.lt/straipsniai/atlieku-tvarkymo-grafikas-jonavos-rajono-seniuniju-gyventojams
        - SĮ „Kretingos komunalininkas“: https://www.kretkom.lt/atlieku-isvezimo-grafikai/
        - UAB „Ecoservice“, Šilutės r.: https://www.silute.lt/veiklos-sritys/aplinkosauga-ir-atlieku-tvarkymas/atlieku-tvarkymas/10160
        - UAB „Ecoservice“, Trakų r.: https://ecoservice.lt/trakugrafikai/
        - UAB „Ecoservice“, Šalčininkų r.: https://ecoservice.lt/salcininkugrafikai/
        - Kėdainių rajono savivaldybės administracija: https://www.kedainiai.lt/gyventojui/atlieku-tvarkymas/atlieku-isvezimo-grafikai/1538
        - UAB „Molėtų švara“: https://www.moletusvara.lt/atlieku-surinkimo-grafikai/
        - Skuodo rajono savivaldybė: https://skuodas.lt/atlieku-tvarkymas-ir-surinkimo-grafikai-2025-m/
        - UAB „Ukmergės autobusų parkas“: https://www.ukmerge.lt/misrios-komunalines-atliekos/
        - UAB „Anykščių komunalinis ūkis“: https://anykom.lt/paslaugos/komunaliniu-atlieku-tvarkymas/
        - UAB „Utenos komunalininkas“: https://www.utenoskom.lt/paslaugos/atlieku-tvarkymas
        - UAB „Elektrėnų komunalinis ūkis“: https://www.eku.lt/atlieku-ir-teritoriju-tvarkymas/atlieku-isvezimo-grafikai/569
        - SĮ „Kompata“: https://www.kompata.lt/grafikai/puslapis/
        - Širvintų rajono savivaldybė: https://www.sirvintos.lt/lt/atlieku-tvarkymas/misriu-komunaliniu-atlieku-surinkimo-grafikas-is-sirvintu-rajono-gyventoju/2998
        - UAB „Kupiškio komunalininkas“: http://www.kupkom.lt/atlieku-isvezimas/
        - Švenčionių rajono savivaldybė: https://svencionys.lt/aplinkosauga/komunaliniu-atlieku-isvezimo-grafikai/
        - Zarasų rajono savivaldybė: https://www.zarasai.lt/veiklos-sritys/aplinkos-apsauga/atlieku-tvarkymas/269
  - type: dropdown
    id: problem
    attributes:
      label: "Что не так?"
      options:
        - "Неверная дата вывоза"
        - "Не могу найти свою деревню или улицу"
        - "Моё место привязано не к той строке графика"
        - "Для моего места нет одного из видов отходов"
        - "Другое"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: "Ваше место"
      description: "Деревня или город, улица и при необходимости номер дома. Заполняется приложением; удалите то, чем не хотите делиться."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Подробности"
      description: "Какой вид отходов и дата? Что указано в официальном графике?"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: "Версия приложения"
  - type: input
    id: data-date
    attributes:
      label: "Дата данных графика"
      description: "Указана внизу главного экрана. Заполняется приложением."

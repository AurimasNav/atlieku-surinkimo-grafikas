name: Bug report
description: Something in the app doesn't work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in Lithuanian, English, Russian or Polish.
        Ačiū, kad pranešate! Galite rašyti lietuviškai.
        For wrong pickup dates, please use the **Wrong dates or address** form instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Tap …
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Filled in automatically when you report from the app (Settings → Report a problem).
  - type: input
    id: device
    attributes:
      label: Phone and system version
      placeholder: e.g. Samsung Galaxy A54, Android 15
  - type: input
    id: language
    attributes:
      label: App language

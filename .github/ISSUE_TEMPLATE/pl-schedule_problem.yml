# Generated by app/scripts/issue-forms.mjs. Edit that file, then run `npm run issue-forms` in app/.
name: "PL · Błędne daty lub adres"
description: "Błędne daty odbioru albo adresu nie można znaleźć lub przypisano go do złego harmonogramu."
title: "[Schedule]: "
labels: ["schedule-data", "lang:pl"]
body:
  - type: markdown
    attributes:
      value: |
        Aplikacja automatycznie przetwarza oficjalne harmonogramy firm wywożących odpady, więc możliwe są błędy. Porównaj z oficjalnym harmonogramem:
        - UAB „Nemenčinės komunalininkas“: https://www.nemenkom.lt/buitiniu-ir-pakuociu-atlieku-surinkimo-grafikas/
        - UAB „Nemėžio komunalininkas“: https://www.nkom.lt/kita.html
        - UAB „Kauno švara“: https://grafikai.svara.lt/
        - UAB „Telšių regiono atliekų tvarkymo centras“: https://tratc.lt/atlieku-surinkimo-grafikai/
        - VšĮ „Gargždų švara“: https://www.gargzdusvara.eu/komunaliniu-atlieku-tvarkymo-grafikai/
        - UAB „Tauragės regiono atliekų tvarkymo centras“: https://www.uabtratc.lt/atlieku-surinkimo-grafikai/
        - UAB „Šiaulių regiono atliekų tvarkymo centras“: https://www.sratc.lt/kalendoriaus-grafikai/
        - UAB „Alytaus regiono atliekų tvarkymo centras“: https://www.aratc.lt/atlieku-surinkimo-grafikai/
        - UAB „Panevėžio regiono atliekų tvarkymo centras“: https://www.pratc.lt/atlieku-isvezimas-atlieku-isvezimas/
        - UAB „Marijampolės apskrities atliekų tvarkymo centras“: https://maatc.lt/atlieku-isvezimo-grafikai/
  - type: dropdown
    id: problem
    attributes:
      label: "Co jest nie tak?"
      options:
        - "Błędna data odbioru"
        - "Nie mogę znaleźć swojej miejscowości lub ulicy"
        - "Moje miejsce przypisano do złego wiersza harmonogramu"
        - "Brakuje rodzaju odpadów dla mojego miejsca"
        - "Coś innego"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: "Twoje miejsce"
      description: "Wieś lub miasto, ulica i w razie potrzeby numer domu. Wypełniane przez aplikację; usuń to, czego nie chcesz udostępniać."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Szczegóły"
      description: "Jaki rodzaj odpadów i data? Co podaje oficjalny harmonogram?"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: "Wersja aplikacji"
  - type: input
    id: data-date
    attributes:
      label: "Data danych harmonogramu"
      description: "Widoczna na dole ekranu głównego. Wypełniane przez aplikację."

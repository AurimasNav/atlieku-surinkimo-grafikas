name: Wrong dates or address
description: Pickup dates are wrong, or your address can't be found or matches the wrong schedule.
title: "[Schedule]: "
labels: [schedule-data]
body:
  - type: markdown
    attributes:
      value: |
        The app converts the official schedules of UAB „Nemenčinės komunalininkas“ automatically,
        so mistakes are possible. Please compare with the official schedule:
        https://www.nemenkom.lt/buitiniu-ir-pakuociu-atlieku-surinkimo-grafikas/
        Galite rašyti lietuviškai.
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong?
      options:
        - A pickup date is wrong
        - My village or street can't be found
        - My place is matched to the wrong schedule row
        - A waste type is missing for my place
        - Something else
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Your place
      description: Village or town, street and, if relevant, house number. Filled in by the app; remove anything you don't want to share.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which waste type and date? What does the official schedule say?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
  - type: input
    id: data-date
    attributes:
      label: Schedule data date
      description: Shown at the bottom of the home screen. Filled in by the app.

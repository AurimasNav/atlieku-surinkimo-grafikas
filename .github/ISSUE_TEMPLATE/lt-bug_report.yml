# Generated by app/scripts/issue-forms.mjs. Edit that file, then run `npm run issue-forms` in app/.
name: "LT · Pranešti apie klaidą"
description: "Kažkas programėlėje veikia ne taip, kaip turėtų."
title: "[Bug]: "
labels: ["bug", "lang:lt"]
body:
  - type: markdown
    attributes:
      value: "Ačiū, kad pranešate! Jei neteisingos išvežimo datos, naudokite formą **Neteisingos datos ar adresas**."
  - type: textarea
    id: what-happened
    attributes:
      label: "Kas nutiko?"
      description: "Ką darėte ir kas nepavyko?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ko tikėjotės?"
  - type: textarea
    id: steps
    attributes:
      label: "Kaip pakartoti"
      placeholder: |
        1. Atidarykite nustatymus
        2. Paspauskite …
  - type: input
    id: app-version
    attributes:
      label: "Programėlės versija"
      description: "Užpildoma automatiškai, kai pranešate iš programėlės."
  - type: input
    id: device
    attributes:
      label: "Telefonas ir sistemos versija"
      placeholder: "pvz., Samsung Galaxy A54, Android 15"
  - type: input
    id: language
    attributes:
      label: "Programėlės kalba"

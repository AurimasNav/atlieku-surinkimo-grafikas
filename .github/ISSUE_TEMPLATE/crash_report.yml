name: Crash report
description: The app showed an error screen or closed unexpectedly.
title: "[Crash]: "
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: |
        The app filled in the technical details below. They contain no personal data, but please
        look them over before submitting. You can write in Lithuanian, English, Russian or Polish.
  - type: textarea
    id: what-were-you-doing
    attributes:
      label: What were you doing when it happened?
      description: Any detail helps, e.g. "changed the language" or "opened the app from a reminder".
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: Filled in by the app.
      render: text
  - type: input
    id: app-version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Phone and system version
  - type: input
    id: language
    attributes:
      label: App language

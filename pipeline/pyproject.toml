[project]
name = "schedule-pipeline"
version = "0.1.0"
description = "Scrapes nemenkom.lt waste collection schedules and converts them to JSON for the mobile app"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.scripts]
schedule-pipeline = "schedule_pipeline.build:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
